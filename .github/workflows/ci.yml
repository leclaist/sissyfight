name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sissyfight_test
          MYSQL_USER: sissyfight
          MYSQL_PASSWORD: sissyfight
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -usissyfight -psissyfight"
          --health-interval 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: mysql://sissyfight:sissyfight@127.0.0.1:3306/sissyfight_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sissyfight:ci .
